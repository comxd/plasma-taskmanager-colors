<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #232629; }
    </style>
  </defs>

  <!-- 3 task bars with colored bottoms — pixel-aligned, no rounding -->

  <!-- Task 1: bar + red -->
  <rect class="ColorScheme-Text" fill="currentColor" x="3" y="3" width="4" height="10"/>
  <rect fill="#e74c3c" x="3" y="14" width="4" height="5"/>

  <!-- Task 2: bar + blue -->
  <rect class="ColorScheme-Text" fill="currentColor" x="9" y="3" width="4" height="10"/>
  <rect fill="#3498db" x="9" y="14" width="4" height="5"/>

  <!-- Task 3: bar + green -->
  <rect class="ColorScheme-Text" fill="currentColor" x="15" y="3" width="4" height="10"/>
  <rect fill="#2ecc71" x="15" y="14" width="4" height="5"/>
</svg>
