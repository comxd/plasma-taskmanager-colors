<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <style id="current-color-scheme" type="text/css">
      .ColorScheme-Text { color: #232629; }
    </style>
  </defs>

  <!-- Panel bar -->
  <rect class="ColorScheme-Text" fill="none" stroke="currentColor" stroke-width="2"
        x="2" y="2" width="44" height="44" rx="4"/>

  <!-- Row 1 -->
  <!-- Task 1: icon + red -->
  <rect class="ColorScheme-Text" fill="currentColor" x="6" y="6" width="10" height="10" rx="2.5"/>
  <rect fill="#e74c3c" x="5" y="18" width="12" height="3.5" rx="1.5"/>

  <!-- Task 2: icon + blue -->
  <rect class="ColorScheme-Text" fill="currentColor" x="19" y="6" width="10" height="10" rx="2.5"/>
  <rect fill="#3498db" x="18" y="18" width="12" height="3.5" rx="1.5"/>

  <!-- Task 3: icon + green -->
  <rect class="ColorScheme-Text" fill="currentColor" x="32" y="6" width="10" height="10" rx="2.5"/>
  <rect fill="#2ecc71" x="31" y="18" width="12" height="3.5" rx="1.5"/>

  <!-- Row 2 -->
  <!-- Task 4: icon + purple -->
  <rect class="ColorScheme-Text" fill="currentColor" x="6" y="25" width="10" height="10" rx="2.5"/>
  <rect fill="#9b59b6" x="5" y="37" width="12" height="3.5" rx="1.5"/>

  <!-- Task 5: icon + orange -->
  <rect class="ColorScheme-Text" fill="currentColor" x="19" y="25" width="10" height="10" rx="2.5"/>
  <rect fill="#e67e22" x="18" y="37" width="12" height="3.5" rx="1.5"/>

  <!-- Task 6: icon + teal -->
  <rect class="ColorScheme-Text" fill="currentColor" x="32" y="25" width="10" height="10" rx="2.5"/>
  <rect fill="#1abc9c" x="31" y="37" width="12" height="3.5" rx="1.5"/>
</svg>
